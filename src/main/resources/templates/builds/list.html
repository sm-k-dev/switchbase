<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('빌드 목록')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>키보드 빌드</h1>
    <p th:if="${message}" class="notice" th:text="${message}"></p>
    <p><a sec:authorize="isAuthenticated()" th:href="@{/builds/new}">새 빌드 등록</a></p>

    <p th:if="${page.empty}" class="muted">아직 등록된 빌드가 없어요.</p>

    <table class="switch-table" th:unless="${page.empty}">
        <thead>
        <tr><th>이름</th><th>작성자</th><th>하우징</th><th>보강판</th><th>마운트</th><th>키캡</th></tr>
        </thead>
        <tbody>
        <tr th:each="b : ${page.content}">
            <td><a th:href="@{/builds/{id}(id=${b.id})}" th:text="${b.displayName}">내 키보드</a></td>
            <td th:text="${b.ownerNickname}">닉네임</td>
            <td th:text="${b.housingLabel} ?: '미지정'">미지정</td>
            <td th:text="${b.plateLabel} ?: '미지정'">미지정</td>
            <td th:text="${b.mountLabel} ?: '미지정'">미지정</td>
            <td th:text="${b.keycapLabel} ?: '미지정'">미지정</td>
        </tr>
        </tbody>
    </table>

    <nav class="pager" th:if="${page.totalPages > 1}">
        <a th:if="${page.hasPrevious()}" th:href="@{/builds(page=${page.number - 1})}">이전</a>
        <span th:text="|${page.number + 1} / ${page.totalPages}|">1 / 3</span>
        <a th:if="${page.hasNext()}" th:href="@{/builds(page=${page.number + 1})}">다음</a>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
