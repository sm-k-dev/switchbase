<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('내 컬렉션')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>내 컬렉션</h1>
    <p th:if="${message}" class="notice" th:text="${message}"></p>

    <!-- 상태 탭 -->
    <nav class="tabs">
        <a th:href="@{/me/collection(status='ALL')}" th:classappend="${status == 'ALL'} ? 'current'">전체</a>
        <a th:href="@{/me/collection(status='FAVORITE')}" th:classappend="${status == 'FAVORITE'} ? 'current'">즐겨찾기</a>
        <a th:href="@{/me/collection(status='OWNED')}" th:classappend="${status == 'OWNED'} ? 'current'">보유</a>
        <a th:href="@{/me/collection(status='TRIED')}" th:classappend="${status == 'TRIED'} ? 'current'">써봤음</a>
    </nav>

    <p th:if="${items.empty}" class="muted">아직 표시한 스위치가 없어요.</p>

    <table class="switch-table" th:unless="${items.empty}">
        <thead>
        <tr><th>스위치</th><th>상태</th><th>추가한 날</th></tr>
        </thead>
        <tbody>
        <tr th:each="it : ${items.content}">
            <td><a th:href="@{/switches/{id}(id=${it.switchId})}" th:text="${it.switchName}">Yellow</a></td>
            <td th:text="${it.statusLabel}">보유</td>
            <td th:text="${#temporals.format(it.createdAt, 'yyyy-MM-dd')}">2026-11-08</td>
        </tr>
        </tbody>
    </table>

    <nav class="pager" th:if="${items.totalPages > 1}">
        <a th:if="${items.hasPrevious()}" th:href="@{/me/collection(status=${status}, page=${items.number - 1})}">이전</a>
        <span th:text="|${items.number + 1} / ${items.totalPages}|">1 / 3</span>
        <a th:if="${items.hasNext()}" th:href="@{/me/collection(status=${status}, page=${items.number + 1})}">다음</a>
    </nav>

    <!-- 공개 여부는 컬렉션 전체에 한 번에 적용(항목별 아님). 기본은 비공개 -->
    <section>
        <h2>공개 설정</h2>
        <form th:action="@{/me/collection/visibility}" method="post">
            <label>
                <input type="checkbox" name="collectionPublic" value="true" th:checked="${collectionPublic}">
                내 컬렉션을 다른 사람에게 공개
            </label>
            <p class="muted">끄면 나만 볼 수 있어요. 항목마다 따로 정할 수 없어요.</p>
            <button type="submit">저장</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
