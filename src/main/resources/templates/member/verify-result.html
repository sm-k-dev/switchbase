<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${success} ? '이메일 인증 완료' : '이메일 인증 실패')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="auth">

    <th:block th:if="${success}">
        <h1>이메일 인증이 완료되었어요</h1>
        <p class="alert alert-info" role="status">이제 가입한 이메일과 비밀번호로 로그인할 수 있어요.</p>
        <a class="button" th:href="@{/login}">로그인하러 가기</a>
    </th:block>

    <th:block th:unless="${success}">
        <h1>인증 링크를 확인할 수 없어요</h1>
        <p class="alert alert-error" role="alert">
            링크가 올바르지 않거나 만료되었어요. 인증 링크는 24시간 동안 유효하며 한 번만 사용할 수 있습니다.
        </p>

        <section class="resend-box">
            <h2>인증 메일을 다시 받기</h2>
            <form class="auth-form" th:action="@{/signup/resend}" method="post">
                <label>가입한 이메일
                    <input type="email" name="email" required maxlength="255" autocomplete="email">
                </label>
                <button type="submit">인증 메일 다시 받기</button>
            </form>
        </section>
    </th:block>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
