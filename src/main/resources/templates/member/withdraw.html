<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원 탈퇴')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>회원 탈퇴</h1>

    <ul>
        <li>탈퇴하면 이 이메일로 로그인할 수 없어요.</li>
        <li>같은 이메일로는 30일 동안 다시 가입할 수 없어요.</li>
        <li>컬렉션과 도움됨 표시는 바로 지워져요.</li>
        <li>내가 쓴 평가·후기·빌드는 30일 동안 목록에 남고, 그 뒤 목록에서 빠지고 완전히 지워져요.</li>
        <li>내 글을 바탕으로 한 위키 수정 기록은 "탈퇴한 회원"으로 남아요.</li>
    </ul>

    <form th:object="${form}" method="post" th:action="@{/me/withdraw}" class="switch-form"
          onsubmit="return confirm('정말 탈퇴할까요? 되돌릴 수 없어요.');">
        <p class="error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>
        <label>확인을 위해 "탈퇴"라고 입력해 주세요
            <input th:field="*{confirmText}" autocomplete="off" required>
        </label>
        <p class="error" th:errors="*{confirmText}"></p>
        <button type="submit">탈퇴하기</button>
    </form>
    <p><a th:href="@{/}">취소하고 돌아가기</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
